<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrimonio V2</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f6f8;color:#172033}header{background:#102033;color:#fff;padding:18px}.wrap{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #dce3ea;border-radius:15px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;font-weight:650}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #c8d1db;border-radius:9px}textarea{min-height:90px}button{cursor:pointer}.primary{background:#102033;color:#fff}.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.areas button{background:#fff;padding:17px;font-weight:700}.msg{padding:10px;border-radius:9px;margin-top:10px}.ok{background:#e8f7ee;color:#17663a}.err{background:#fdecec;color:#9f2525}.task{border:1px solid #dce3ea;border-radius:12px;padding:14px;margin:10px 0;display:grid;gap:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#eef2f6;border-radius:999px;padding:5px 9px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check{display:flex;flex-direction:row;align-items:center;font-weight:500}.check input{width:auto}.qty{width:75px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}@media(max-width:700px){.grid,.areas,.checks{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="wrap head"><div><small>Dirección de Patrimonio</small><h2 style="margin:3px 0">Solicitudes V2</h2></div><button id="panel">Panel interno</button></div></header><main class="wrap"><div id="app"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://fcevjeyjzqdsityurnbs.supabase.co','sb_publishable_K2CCh4-pd3HTli4Pu9GB4g_kgjhc8iQ');const A=['Logística','Mantenimiento','Automotor','Almacén','Servicios','Limpieza','Personal'];const app=document.querySelector('#app');document.querySelector('#panel').onclick=login;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const v=id=>document.querySelector('#'+id)?.value||'';const field=(id,t,type='text',req=true)=>`<label>${t}<input id="${id}" type="${type}" ${req?'required':''}></label>`;const ta=(id,t,req=false)=>`<label class="full">${t}<textarea id="${id}" ${req?'required':''}></textarea></label>`;const base=()=>`${field('sol','Quién pide')}${field('tel','Teléfono')}${field('mail','Mail opcional','email',false)}${field('lugar','Sede / institución / lugar')}${field('dir','Dirección')}`;function home(){app.innerHTML=`<section class="card"><h2>¿Qué necesitás solicitar?</h2><p>Elegí el área. Para realizar pedidos no necesitás usuario.</p><div class="areas">${A.map(x=>`<button data-a="${x}">${x}</button>`).join('')}</div></section>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>area(b.dataset.a))}async function crear(mod,tipo,datos,fecha='',desc=''){const{data,error}=await sb.rpc('crear_solicitud_publica',{p_modulo:mod.toLowerCase(),p_tipo:tipo,p_solicitante:v('sol'),p_lugar:v('lugar'),p_telefono:v('tel'),p_email:v('mail'),p_fecha_requerida:fecha||null,p_descripcion:desc||null,p_datos:{...datos,direccion:v('dir')}});const m=document.querySelector('#msg');m.className='msg '+(error?'err':'ok');m.textContent=error?'No se pudo enviar: '+error.message:'Solicitud enviada correctamente. Número: '+data;if(!error)document.querySelector('form')?.reset()}function shell(t,inner){app.innerHTML=`<section class="card"><button onclick="location.reload()">← Volver</button><h2>${t}</h2>${inner}</section>`}async function area(a){if(a==='Logística')return logistica();if(a==='Mantenimiento')return mantenimiento();if(a==='Automotor')return automotor();if(a==='Almacén')return almacen();if(a==='Servicios')return servicios();if(a==='Limpieza')return limpieza();if(a==='Personal')return personal()}async function logistica(){const{data:els}=await sb.from('elementos_logistica').select('id,nombre').order('id');shell('Logística',`<label>Tipo de solicitud<select id="tipo"><option value="elementos">Pedido de elementos</option><option value="traslado">Traslado de cosas</option><option value="traslado_logistica">Traslado de elementos de Logística</option></select></label><div id="sub"></div>`);const tipo=document.querySelector('#tipo');tipo.onchange=render;render();function render(){const t=tipo.value;if(t==='elementos'){document.querySelector('#sub').innerHTML=`<form class="grid">${base()}${field('fe','Fecha de entrega','date')}${field('he','Hora de entrega','time')}${field('fr','Fecha de retiro / devolución','date')}${field('hr','Hora de retiro / devolución','time')}<div class="full"><h3>Elementos</h3><div class="checks">${(els||[]).map(e=>`<div><label class="check"><input class="el" type="checkbox" data-n="${esc(e.nombre)}"> ${esc(e.nombre)}</label><input class="qty" type="number" min="1" value="1" disabled></div>`).join('')}</div></div>${ta('desc','Observaciones')}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`;document.querySelectorAll('.el').forEach(c=>c.onchange=()=>c.parentElement.nextElementSibling.disabled=!c.checked);document.querySelector('form').onsubmit=e=>{e.preventDefault();const items=[...document.querySelectorAll('.el:checked')].map(c=>({nombre:c.dataset.n,cantidad:+c.parentElement.nextElementSibling.value}));if(!items.length)return alert('Elegí al menos un elemento');crear('logistica','pedido_elementos',{elementos:items,fecha_entrega:v('fe'),hora_entrega:v('he'),fecha_retiro:v('fr'),hora_retiro:v('hr'),seguimiento_logistico:{etapa:'pedido_recibido'}},v('fe'),v('desc'))}}else{document.querySelector('#sub').innerHTML=`<form class="grid">${field('sol','Quién pide')}${field('tel','Teléfono')}${field('mail','Mail opcional','email',false)}${field('lr','Lugar de retiro')}${field('dr','Dirección de retiro')}${field('fre','Fecha de retiro','date')}${field('hre','Hora de retiro','time')}${field('lugar','Lugar de entrega')}${field('dir','Dirección de entrega')}${field('fen','Fecha de entrega','date')}${field('hen','Hora de entrega','time')}${ta('desc','Qué se traslada / cantidades',true)}${ta('obs','Observaciones')}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`;document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('logistica',t,{retiro:{lugar:v('lr'),direccion:v('dr'),fecha:v('fre'),hora:v('hre')},entrega:{lugar:v('lugar'),direccion:v('dir'),fecha:v('fen'),hora:v('hen')},observaciones:v('obs'),seguimiento_logistico:{etapa:'pedido_recibido'}},v('fen'),v('desc'))}}}}function mantenimiento(){shell('Mantenimiento',`<div id="gate"><label>Código de acceso<input id="cod" type="password"></label><button id="validar" class="primary">Ingresar</button><div id="msg"></div></div><div id="mf"></div>`);document.querySelector('#validar').onclick=async()=>{const{data,error}=await sb.rpc('validar_codigo_mantenimiento',{p_codigo:v('cod')});if(error||!data)return document.querySelector('#msg').innerHTML='<div class="msg err">Código incorrecto</div>';document.querySelector('#gate').remove();document.querySelector('#mf').innerHTML=`<form class="grid">${base()}${field('fecha','Fecha requerida','date')}${ta('desc','Descripción del trabajo',true)}${ta('obs','Observaciones')}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`;document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('mantenimiento','reparacion',{observaciones:v('obs')},v('fecha'),v('desc'))}}}function automotor(){shell('Automotor',`<form class="grid">${base()}${field('veh','Vehículo')}${field('pat','Patente', 'text',false)}<label>Solicitud<select id="mot"><option>Cambio de cubiertas</option><option>Cubierta pinchada</option><option>Cambio de aceite</option><option>Cambio de filtro</option><option>Reparación</option><option>Solicitud de seguro</option><option>VTV</option><option>Cédula</option><option>Extravío de patente</option><option>Otro</option></select></label>${field('fecha','Fecha requerida','date')}${ta('desc','Descripción / detalle',true)}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`);document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('automotor',v('mot').toLowerCase().replaceAll(' ','_'),{vehiculo:v('veh'),patente:v('pat')},v('fecha'),v('desc'))}}function almacen(){shell('Almacén · Reclamo de faltantes',`<p>Este módulo no reemplaza la app de pedidos. Se usa para informar faltantes.</p><form class="grid">${base()}${field('pedido','Pedido / referencia', 'text',false)}${field('art','Artículo faltante')}${field('solic','Cantidad solicitada','number')}${field('rec','Cantidad recibida','number')}${field('falt','Cantidad faltante','number')}${ta('desc','Observación')}<button class="primary full">Enviar reclamo</button><div id="msg" class="full"></div></form>`);document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('almacen','faltante',{pedido:v('pedido'),articulo:v('art'),cantidad_solicitada:v('solic'),cantidad_recibida:v('rec'),cantidad_faltante:v('falt')},'',v('desc'))}}function servicios(){shell('Servicios',`<label>Servicio<select id="srv"><option value="agua">Agua</option><option value="matafuegos">Matafuegos</option><option value="impresoras">Impresoras Ricoh</option><option value="desagote">Desagote</option><option value="tanque">Limpieza de tanque</option><option value="fumigacion">Fumigación</option></select></label><div id="sf"></div>`);const s=document.querySelector('#srv');s.onchange=render;render();function render(){let extra='';if(s.value==='agua')extra=`<label>Motivo<select id="mot"><option>No pasó el proveedor</option><option>Se rompió el dispenser frío/calor</option><option>Dejaron pocos bidones</option><option>Solicito bidones</option><option>Otro</option></select></label>${field('cant','Cantidad de bidones','number',false)}`;if(s.value==='fumigacion')extra=`<div class="full"><b>Problema</b><div class="checks">${['Desratización','Cucarachas','Hormigas'].map(x=>`<label class="check"><input type="checkbox" class="plaga" value="${x}"> ${x}</label>`).join('')}</div></div>`;if(s.value==='impresoras')extra=`<label>Motivo<select id="mot"><option value="rota">Impresora rota</option><option value="toner">Falta de tóner</option></select></label>${field('equipo','Modelo / identificación','text',false)}${field('toner','Número de tóner','text',false)}${field('cant','Cantidad','number',false)}`;document.querySelector('#sf').innerHTML=`<form class="grid">${base()}${field('fecha','Fecha requerida','date')}${extra}${ta('desc','Descripción / observaciones')}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`;document.querySelector('form').onsubmit=e=>{e.preventDefault();const d={motivo:v('mot'),cantidad:v('cant'),equipo:v('equipo'),toner:v('toner'),problemas:[...document.querySelectorAll('.plaga:checked')].map(x=>x.value)};crear('servicios',s.value,d,v('fecha'),v('desc'))}}}function limpieza(){shell('Limpieza',`<form class="grid">${base()}${field('fecha','Fecha','date')}${field('desde','Horario desde','time')}${field('hasta','Horario hasta','time')}${field('evento','Tipo de actividad / evento')}${field('personas','Cantidad estimada de personas','number',false)}${ta('desc','Descripción / necesidad',true)}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`);document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('limpieza','solicitud_limpieza',{horario_desde:v('desde'),horario_hasta:v('hasta'),tipo_evento:v('evento'),personas:v('personas')},v('fecha'),v('desc'))}}function personal(){shell('Personal',`<form class="grid">${base()}<label>Tipo de solicitud<select id="mot"><option>Consulta de personal</option><option>Ausencia</option><option>Licencia</option><option>Vacaciones</option><option>ART</option><option>Horas extras</option><option>Otro</option></select></label>${field('fecha','Fecha relacionada','date',false)}${ta('desc','Detalle de la solicitud',true)}<button class="primary full">Enviar solicitud</button><div id="msg" class="full"></div></form>`);document.querySelector('form').onsubmit=e=>{e.preventDefault();crear('personal',v('mot').toLowerCase().replaceAll(' ','_'),{},v('fecha'),v('desc'))}}function login(){shell('Panel interno',`<form id="lf" class="grid">${field('usr','Usuario')}${field('pwd','Contraseña','password')}<button class="primary full">Ingresar</button><div id="msg" class="full"></div></form>`);document.querySelector('#lf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:v('usr').trim().toLowerCase()+'@patrimonio.local',password:v('pwd')});if(error)return document.querySelector('#msg').innerHTML='<div class="msg err">Usuario o contraseña incorrectos.</div>';panel()}}async function panel(){const{data:uid}=await sb.rpc('mi_usuario_id');const{data:p}=await sb.from('usuarios').select('id,nombre,rol').eq('id',uid).single();const[{data:ss,error:se},{data:us},{data:rs}]=await Promise.all([sb.from('solicitudes').select('*').order('creado_en',{ascending:false}),sb.rpc('listar_usuarios_panel'),sb.rpc('listar_responsables_panel')]);if(se)return shell('Panel interno',`<div class="msg err">No se pudieron cargar las solicitudes: ${esc(se.message)}</div>`);const admin=p?.rol==='admin';shell(`Panel · ${esc(p?.nombre)} (${esc(p?.rol)})`,`<div class="toolbar"><button id="out">Cerrar sesión</button><select id="farea"><option value="">Todas las áreas</option>${A.map(x=>`<option value="${x.toLowerCase()}">${x}</option>`).join('')}</select></div><div id="tasks"></div>`);document.querySelector('#out').onclick=async()=>{await sb.auth.signOut();home()};const draw=()=>{const fa=v('farea');document.querySelector('#tasks').innerHTML=(ss||[]).filter(s=>!fa||s.modulo===fa).map(s=>{const resp=(rs||[]).filter(r=>r.solicitud_id===s.id);const seg=s.datos?.seguimiento_logistico?.etapa||'pedido_recibido';return `<article class="task"><div><strong>${esc(s.codigo)}</strong> <span class="chip">${esc(s.modulo)}</span> <span class="chip">${esc(s.tipo)}</span></div><div><b>Solicita:</b> ${esc(s.solicitante)} · ${esc(s.telefono||'')} ${s.lugar?'· '+esc(s.lugar):''}</div>${s.descripcion?`<div><b>Descripción:</b> ${esc(s.descripcion)}</div>`:''}<details><summary>Ver detalle completo</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(s.datos||{},null,2))}</pre></details><div class="grid"><label>Estado<select class="estado" data-id="${s.id}">${['nueva','revisada','asignada','en_ejecucion','en_espera','finalizada','cancelada'].map(x=>`<option ${s.estado===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Prioridad<select class="prio" data-id="${s.id}">${['baja','normal','alta','urgente'].map(x=>`<option ${s.prioridad===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${admin?`<div><b>Responsables</b><div class="checks resp" data-id="${s.id}">${(us||[]).map(u=>`<label class="check"><input type="checkbox" value="${u.id}" ${resp.some(r=>r.usuario_id===u.id)?'checked':''}> ${esc(u.nombre)}</label>`).join('')}</div><button class="saveResp" data-id="${s.id}">Guardar responsables</button></div>`:`<div><b>Responsables:</b> ${resp.map(r=>esc(r.nombre)).join(', ')||'Sin asignar'}</div>`}${s.modulo==='logistica'?`<label>Seguimiento Logística<select class="seg" data-id="${s.id}">${[['pedido_recibido','Pedido recibido'],['preparando','Preparando'],['salio_deposito','Salió del depósito'],['entregado','Entregado'],['pendiente_retiro','Pendiente de retiro'],['devuelto','Devuelto']].map(([x,n])=>`<option value="${x}" ${seg===x?'selected':''}>${n}</option>`).join('')}</select></label>`:''}<div class="grid"><label class="full">Nota interna<textarea class="nota" data-id="${s.id}"></textarea></label><button class="guardarGestion" data-id="${s.id}">Guardar gestión / nota</button></div></article>`}).join('')||'<p>No hay solicitudes.</p>';bind()};document.querySelector('#farea').onchange=draw;draw();function bind(){document.querySelectorAll('.saveResp').forEach(b=>b.onclick=async()=>{const ids=[...document.querySelector(`.resp[data-id="${b.dataset.id}"]`).querySelectorAll('input:checked')].map(x=>x.value);const{error}=await sb.rpc('asignar_responsables',{p_solicitud_id:b.dataset.id,p_usuario_ids:ids});alert(error?error.message:'Responsables guardados');if(!error)panel()});document.querySelectorAll('.guardarGestion').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const card=b.closest('.task');const{error}=await sb.rpc('actualizar_gestion_solicitud',{p_solicitud_id:id,p_estado:card.querySelector('.estado').value,p_prioridad:card.querySelector('.prio').value,p_nota:card.querySelector('.nota').value||null});alert(error?error.message:'Gestión guardada')});document.querySelectorAll('.seg').forEach(s=>s.onchange=async()=>{const{error}=await sb.rpc('actualizar_seguimiento_logistico',{p_solicitud_id:s.dataset.id,p_etapa:s.value});alert(error?error.message:'Seguimiento actualizado')})}}home();</script></body></html>
